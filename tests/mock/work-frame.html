<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>章节测验 - 学习通模拟（iframe 版）</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f6fa; }
  .layout { display: flex; height: 100vh; }
  .main { flex: 1; }
  #frame_content { width: 100%; height: 100%; border: 0; display: block; }
  .posCatalog { width: 220px; border-left: 1px solid #ddd; background: #fff; }
  .chapter_item { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; cursor: pointer; }
  .chapter_item.currents { color: #1e6fff; border-left: 3px solid #1e6fff; background: #f0f6ff; }
  /* 真实"下一节"按钮：只在批阅页（确认提交后）可见 */
  #prevNextFocusNext {
    position: fixed; right: 240px; bottom: 16px; padding: 8px 18px;
    background: #1e6fff; color: #fff; border-radius: 6px; cursor: pointer; display: none;
  }
</style>
</head>
<body>
<!-- 真实链路：顶层只有外壳 + 目录 + "下一节"按钮；题目在最内层 iframe#frame_content -->
<div class="layout">
  <div class="main">
    <iframe id="frame_content" name="frame_content" src="/work.html"></iframe>
  </div>
  <div class="posCatalog" id="catalog">
    <div class="chapter_item currents" data-idx="0"><a href="javascript:void(0)">第2节 章节测验</a></div>
    <div class="chapter_item" data-idx="1"><a href="javascript:void(0)">第3节 视频任务点</a></div>
    <div class="chapter_item" data-idx="2"><a href="javascript:void(0)">第4节 视频任务点</a></div>
  </div>
</div>
<a id="prevNextFocusNext">下一节</a>

<script>
  window.__TEST = {
    nextClicks: 0,      // 点「下一节」整页跳转的次数
    switches: 0,        // 通过目录节点跳转的次数（postNext → goNext 的路径）
    inner: function () {
      try { return document.getElementById('frame_content').contentWindow.__TEST; } catch (e) { return null; }
    },
    markingVisible: function () {
      var box = document.getElementById('cxas-mock-marking');
      return !!box && box.getBoundingClientRect().width > 0;
    },
  };

  // 确认提交成功后，由内层 iframe 调用它，把"下一节"按钮露出来（真实批阅页行为）
  window.__SHOW_NEXT__ = function () {
    document.getElementById('prevNextFocusNext').style.display = 'inline-block';
  };

  document.getElementById('prevNextFocusNext').addEventListener('click', function () {
    window.__TEST.nextClicks++;
    try { localStorage.setItem('test_next_clicked', '1'); } catch (e) { /* 忽略 */ }
  });

  Array.prototype.slice.call(document.querySelectorAll('.chapter_item')).forEach(function (n, i) {
    n.addEventListener('click', function () {
      if (i === 0) return;
      window.__TEST.switches++;
      Array.prototype.slice.call(document.querySelectorAll('.chapter_item')).forEach(function (x) {
        x.classList.remove('currents');
      });
      n.classList.add('currents');
    });
  });
</script>
<script src="/user.js"></script>
</body>
</html>
